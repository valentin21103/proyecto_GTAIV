[OPTIONS]
; AUTO = the game's language, or one of: EN FR IT DE ES RU
LANGUAGE=AUTO

; Sizes: 1.0 = default
WHEEL_SIZE=1.0
ICON_SIZE=1.0
TEXT_SIZE=1.0
; Weapon name height: negative = up, positive = down
NAME_OFFSET_Y=-6

; Blur strength: 0.5 to 8, decimals allowed
BACKGROUND_BLUR=true
BLUR_STRENGTH=1.5
BLUR_FADE_OUT_MS=250
; Screen darkening: 0 to 255
DIM_ALPHA=50
VIGNETTE_ALPHA=255

; true = press the key to open and close, false = hold it
KEY_TOGGLES_WHEEL=true
; How long to hold before the wheel opens
WHEEL_OPEN_DELAY_MS=250
ENABLE_SLOW_MOTION=true
SLOW_MOTION_SCALE=0.1
ENABLE_SOUNDS=true
ENABLE_SWITCHING_IN_CAR=false
; true = also block the game's own weapon switching while the wheel is closed
DISABLE_OLD_SWITCHING=false
USE_XBOX_CONTROLLER=true

; In a vehicle, hold RADIO_WHEEL_KEY or d-pad left/right
RADIO_WHEEL=true
; 1.0 = default. Same value for both keeps the icons fitting the discs
RADIO_WHEEL_SIZE=1.0
RADIO_ICON_SIZE=1.0
; false = normal speed while it is open
RADIO_SLOW_MOTION=true
; true = only the wheel changes station
DISABLE_OLD_RADIO_SWITCHING=true
; COLORED, UNCOLORED, or SELECTED (only the chosen station in color)
RADIO_ICONS=SELECTED

[KEYS]
WEAPON_MENU_KEY=Tab
SWITCH_TYPE_KEY=ShiftKey
PARACHUTE_SWITCH_KEY=R
DROP_WEAPON_KEY=E
; None = radio wheel on the controller only
RADIO_WHEEL_KEY=Q

; Buttons: A B X Y LB RB LT RT LS RS BACK START DUP DDOWN DLEFT DRIGHT
PAD_OPEN_BUTTON=LB
PAD_NEXT_TYPE_BUTTON=RT
PAD_PREV_TYPE_BUTTON=LT
PAD_PARACHUTE_BUTTON=Y
PAD_DROP_BUTTON=X

; Where each station sits: 0 is bottom center, then clockwise to 23
[RADIO_ORDER]
RADIO_OFF=0
TUFF_GONG=1
FUSION_FM=2
IF99=3
INTEGRITY=4
THE_JOURNEY=5
MASSIVE_B=6
JAZZ_NATION=7
PLR=8
SELF_ACTUALIZATION=9
RAMJAM=10
INDEPENDENCE=11
LIBERTY_ROCK=12
VICE_CITY_FM=13
THE_BEAT=14
LCHC=15
WKTT=16
VLADIVOSTOK=17
RADIO_BROKER=18
K109=19
ELECTRO_CHOC=20
THE_VIBE=21
SAN_JUAN=22
THE_CLASSICS=23
