; ============================================================================
;  DoubleHomicide.ini
;  Every dual-wieldable weapon is a section. A weapon is only used if its
;  section name appears in the guns= list below.
;
;  ADDING A GUN
;    1. Copy any [Section] below and give it a new unique name.
;    2. Set weaponId (the player's weapon) and model (the second gun's model).
;    3. Add the section name to guns= in [general].
;    4. Reload the script from the IV-SDK .NET Manager (or restart the game).
;
;  ADDING ANIMATIONS
;    Put your animation set (e.g. gun@mygun.wad) into anim.img with OpenIV,
;    then set animSet=gun@mygun in the gun's section. The set must contain
;    clips named like the ones listed in drawAnims / holsterAnims below.
;    Leave animSet empty to watch every animation set used by other guns.
; ============================================================================

[general]
enabled=1
toggleKey=F10
; tuneEnabled   1 = F9 turns on tune mode (move the left gun with the keyboard, see below)
;               0 = F9 does nothing (use this once your guns are tuned)
tuneEnabled=0
; showMessages  1 = show a short on-screen message when you switch between one and two guns
;               (modeKey / padModeButtons) or turn the mod on or off (toggleKey)
;               0 = show no message at all
; messageStyle  small    = small text in the top-left corner, like most script messages (default)
;               subtitle = the large game subtitle at the bottom of the screen (the old look)
showMessages=1
messageStyle=small
; draw animation progress (0 to 1) at which the second gun appears
attachAnimTime=0.8
pollIntervalMs=50
; milliseconds each gun model stays visible at startup so its texture can stream in
modelWarmupMs=500
; debug    1 = print extra messages in the console while playing (0 = off)
; logFile  1 = also write DoubleHomicide.log in the game folder (for bug reports, 0 = off)
debug=0
logFile=0
; --- firing and modes ---
; fireMode   default for guns that do not set their own: simultaneous, stagger or alternate
;            (each gun section below can override it)
; dualMode   0 = one gun (default), 1 = two guns. F1 (modeKey) switches while playing.
; modeKey    key that switches between one and two guns while playing
; dualAnimScope  held = the two-gun animation set (animSetDual) is only put on the weapon the player
;                 is holding, so police and pedestrians keep the normal set unless they carry the
;                 same gun at the same moment. all = every enabled gun uses it while two guns are on.
dualAnimScope=held
fireMode=simultaneous
dualMode=0
; 1 = briefly holster and re-draw the weapon after the animation set changes
reequipOnSwitch=1
; attach the left gun this many ms after you equip a weapon even if no draw animation
; was detected (0 = only attach on the draw animation or when you start shooting)
fallbackAttachMs=1200
modeKey=F1

; --- game controller ---
; padEnabled        1 = allow controller buttons for the actions below
; padModeButtons    hold all of these buttons to switch between one and two guns (like F1)
; padToggleButtons  hold all of these to turn the mod on or off (like F10); empty = not used
; padIndex          controller number, normally 0
; Button names: LB LT RB RT DPAD_UP DPAD_DOWN DPAD_LEFT DPAD_RIGHT START BACK X Y A B
;               STICK_LEFT STICK_RIGHT (PlayStation names L1 L2 R1 R2 SQUARE TRIANGLE CROSS CIRCLE
;               L3 R3 also work). Join buttons with +, for example RB+DPAD_DOWN.
; The game still sees these buttons too, so pick a combination you do not use in play.
; Tune mode (F9) is keyboard only.
padEnabled=1
padIndex=0
padModeButtons=RB+DPAD_DOWN
padToggleButtons=

; --- script-driven gun pose (no animation files) ---
; poseEnabled   1 = lower the left-hand gun when you are not aiming
; poseSpeed     how fast it moves between poses (higher = faster)
; aimHoldMs     how long the gun stays raised after you stop aiming/shooting
poseEnabled=1
poseSpeed=6
aimHoldMs=1500
; 1 = refuse to spawn models the game says do not exist (prevents crashes), but
; it wrongly blocks some EFLC models, so it is 0 here.
checkModels=0
drawAnims=unholster,unholster_crouch
holsterAnims=holster,holster_crouch,discard,discard_crouch
guns=Glock,Deagle,CombatShotgun,Uzi,MP5,Pistol44,SawnOff,CZ75,AA12,GoldenUzi,P90,Pistol8Bull,SilencedPistol

; ---------------------------------------------------------------------------
;  Per-gun keys
;    enabled     1 or 0
;    weaponId    GTA.Weapon value of the weapon the player holds
;    model       model name of the second gun
;    animSet     the animation set the game uses for this weapon with ONE gun (e.g. gun@44A)
;    animSetDual optional: animation set used while TWO guns are active (e.g. gun@44A2).
;                The mod switches the weapon between the two sets when you press modeKey.
;    weaponModel optional: the weapon's own model name in the game's weapon data. Only used to
;                find the weapon in memory on game versions without known addresses (EFLC,
;                Complete Edition). Defaults to model.
;    bone        bone the second gun attaches to (1219 = left hand)
;    offset      x,y,z attach offset
;    rotation    x,y,z attach rotation in degrees
;    shootPower  damage value passed to FIRE_SINGLE_BULLET
;    spread      heading offset in degrees for the second bullet stream
;    ammoCost    extra ammo removed per shot
;    muzzleFx    particle effect on the gun, or none
;    traceFx     bullet trace effect, or none
;    lowerOffset    x,y,z added to offset while the gun is lowered (not aiming)
;    lowerRotation  x,y,z degrees added to rotation while lowered
;    kickRotation   x,y,z degrees added to rotation while shooting (recoil)
;  TUNE MODE (keyboard, works while playing): press F9, then use
;    NumPad4/6 offset X, NumPad2/8 offset Y, NumPad1/7 offset Z,
;    Insert/Delete rotation X, Home/End rotation Y, PageUp/PageDown rotation Z,
;    NumPad0 coarse/fine steps, NumPad5 prints and saves values to DoubleHomicide_tuned.txt
;  dh_hold toggles keeping the gun raised, so you can tune with the console open.
;  Tune the main hand position live in the console (aim or shoot to see it):
;    dh_pos <GunId> offX offY offZ rotX rotY rotZ       e.g.  dh_pos Pistol44 0.025 0.045 0.01 -170 0 0
;  Tune lowered pose live in the console:
;    dh_lower <GunId> offX offY offZ rotX rotY rotZ     e.g.  dh_lower Glock 0 0 0 40 0 0
; ---------------------------------------------------------------------------

; ---- guns: IDs, models and animation sets come from WeaponInfo.xml ----------
;  fireMode per gun (overrides the one in [general]):
;    simultaneous  left gun fires every tick the right gun shoots (use for full auto)
;    stagger       left gun fires halfway between two right-hand shots
;    alternate     left gun fires on every second trigger pull
;  offset/rotation of guns that have never been tuned are guesses copied from
;  similar guns. Use F9 tune mode in game, then paste the saved values here.

[Glock]
enabled=1
weaponId=7
model=w_glock
animSet=gun@handgun
animSetDual=gun@handgun2
fireMode=stagger
offset=0.1537,0.01,-0.002
rotation=-170,0,0
shootPower=30
muzzleFx=muz_pistol_small
traceFx=wpn_bullet_trace

