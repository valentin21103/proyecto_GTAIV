GangsterModels = M_Y_GAFR_LO_01, M_Y_GAFR_LO_02, M_Y_GAFR_HI_01, M_Y_GAFR_HI_02, M_Y_GALB_LO_01, M_Y_GALB_LO_02, M_Y_GALB_LO_03, M_Y_GALB_LO_04, M_M_GBIK_LO_03, M_Y_GBIK_HI_01, M_Y_GBIK_HI_02, M_Y_GBIK02_LO_02, M_Y_GBIK_LO_01, M_Y_GBIK_LO_02, M_Y_GIRI_LO_01, M_Y_GIRI_LO_02, M_Y_GIRI_LO_03, M_M_GJAM_HI_01, M_M_GJAM_HI_02, M_M_GJAM_HI_03, M_Y_GJAM_LO_01, M_Y_GJAM_LO_02, M_Y_GKOR_LO_01, M_Y_GKOR_LO_02, M_Y_GLAT_HI_01, M_Y_GLAT_HI_02, M_Y_GLAT_LO_01, M_Y_GLAT_LO_02, M_Y_GMAF_HI_01, M_Y_GMAF_HI_02, M_Y_GMAF_LO_01, M_Y_GMAF_LO_02, M_O_GRUS_HI_01, M_Y_GRUS_LO_01, M_Y_GRUS_LO_02, M_Y_GRUS_HI_02, M_M_GRU2_HI_01, M_M_GRU2_HI_02, M_M_GRU2_LO_02, M_Y_GRU2_LO_01, M_M_GTRI_HI_01, M_M_GTRI_HI_02, M_Y_GTRI_LO_01, M_Y_GTRI_LO_02

