; PUSHER settings. Delete this file to get every default back.
IniVersion = 61

; ---- compatibility (1 = on). Pusher works on its own either way.
; GreetTauntRob: once that script has its Pusher section, it shows Sell Drugs and Pusher hides its own lock-on UI.
GreetTauntRobCompat = 1
; StopRightThere: speeding stops can turn into a trunk search (car) or a pat-down (bike).
StopRightThereCompat = 1

; ---- PRICES
; A dealer sells in packs (BuyPerPress below: 5g coke, 5g heroin, 5 pills). Price of one pack:
BuyPackCoke = 250
BuyPackHeroin = 285
BuyPackPills = 145
; The same pack once you have visited that dealer this many times (robbing him resets it):
VisitsForRegularPrice = 10
RegularPackCoke = 230
RegularPackHeroin = 250
RegularPackPills = 115
; What a buyer pays you per gram / pill:
SellCoke = 65
SellHeroin = 80
SellPills = 50
; Bulk buyers: % of buyers who want BulkAmount at once, and the % off the normal price they get:
BulkBuyerChance = 20
BulkAmount = 10
BulkDiscount = 5

; ---- amounts
; most you can carry
MaxCoke = 30
MaxHeroin = 20
MaxPills = 60
; one pack: how much one press buys at a dealer
BuyPerPressCoke = 5
BuyPerPressHeroin = 5
BuyPerPressPills = 5
; what each dealer has; an emptied drug comes back after RestockMinutes (real minutes)
DealerStockCoke = 30
DealerStockHeroin = 20
DealerStockPills = 60
RestockMinutes = 7
; a normal buyer wants a random amount of a drug between these (bulk buyers want BulkAmount)
SellMinCoke = 1
SellMinHeroin = 1
SellMinPills = 1
SellMaxCoke = 9
SellMaxHeroin = 9
SellMaxPills = 9
; a buyer who wants this much or more of a drug tries to rob you this % of the time
BigOrderFrom = 7
BigOrderRobChance = 30
; coke deals of this many grams or more show the coke pack instead of the bag
CokePackFrom = 7

; ---- robbing a dealer (LB at his menu)
; % he puts his hands up and drops his money and drugs; otherwise he pulls this weapon (Pistol, Knife, None)
DealerRobComplyChance = 50
DealerFightWeapon = Pistol
DealerRobCashMin = 75
DealerRobCashMax = 380
; he also drops 1, 2 or all 3 drugs, each a random amount between these
DealerRobMinCoke = 3
DealerRobMinHeroin = 2
DealerRobMinPills = 4
DealerRobMaxCoke = 6
DealerRobMaxHeroin = 6
DealerRobMaxPills = 8

; ---- what can go wrong on a sale (percent)
; % a buyer robs your drugs (PunchChance) or your cash (RobChance), out of 100; Bulk* when the sale is BulkRobFrom or more at once
PunchChance = 15
RobChance = 15
BulkPunchChance = 23
BulkRobChance = 22
BulkRobFrom = 10
HookerStingChance = 30
; cash dropped by a buyer who punched you and ran, once you kill him
PunchCashMin = 26
PunchCashMax = 132
; cash a robber takes (never more than you have)
RobCashMin = 30
RobCashMax = 2000
; length of the robber's search in ms (money and drugs go at the halfway point)
RobSearchMs = 6000
; how long you stay down after a punch, and the health it costs
KnockdownMs = 2000
PunchDamage = 3
; Random (knife or pistol, 50/50), Knife, Pistol or None
RobberWeapon = Random
; with RobberWeapon = Random: % the cash robber has a pistol (else a knife), % the product robber has one (else fists)
CashRobberPistolChance = 75
ProductRobberPistolChance = 50
; how far in front of you the robber stands while he goes through your pockets (metres)
FriskDistance = 1.1
; squad cars sent in when a hooker turns out to be an undercover cop (0-8)
StingSquadCars = 5
; 1 = no Sell Drugs while you are holding a weapon
SellOnlyUnarmed = 1

; ---- police search during a StopRightThere speeding stop
; % of stops that become a search (trunk in a car, frisk on a bike), and % the officer finds your drugs
SearchChance = 20
SearchFindChance = 20
; how long he searches before the roll (ms); crim_cuffed is held at this point (ms) so the hands stay behind the back
SearchMs = 5000
CuffHoldMs = 5500
; in the back of the squad car: after LockpickAfterMs, RB this many times (each within LockpickWindowMs) picks the cuffs
LockpickPresses = 10
LockpickWindowMs = 700
LockpickAfterMs = 10000
RideSpeed = 12
; armsup_2_searched_pose is held at this point (0-1) so the hands stay on the head; the cuffing officer stands this far behind you (m)
HandsOnHeadPhase = 0.85
CuffDistance = 0.85
; while cop_cuff plays, the officer's hips are held this far straight behind yours (bigger = further back)
CuffHipDistance = 0.5
; during a search: traffic from behind stops this many metres behind the squad car's rear bumper,
; traffic from the front this many metres in front of your front bumper, across this half-width of road (0 = off)
HaltBehindSquadCar = 7
HaltAheadOfYourCar = 5
HaltRoadHalfWidth = 12
; found: ms the game's own hands-up plays before armsup_loop takes over
HandsUpToLoopMs = 1500
; the cuffed get-in: degrees you are turned from the car's heading when get_in_ds starts
GetInHeadingOffset = 0
; a police officer within this many metres of a deal: 1 star, the dealer / buyer runs (0 = off)
CopNearDealRange = 15
; caught, then you move further than this many metres: wanted level jumps to FleeWantedLevel (cops open fire)
ArrestFleeDistance = 12
FleeWantedLevel = 2

; ---- buttons: A B X Y LB RB RT DpadUp DpadDown DpadLeft DpadRight Back Start LS RS
; an icon named after the button (Icons\RB.png) is drawn if it exists
ButtonSellDrugs = RT
ButtonCoke = RT
ButtonHeroin = DpadLeft
ButtonPills = DpadRight
; dealer menu: rob him
ButtonRobDealer = LB
KeySellDrugs = D4
KeyCoke = D1
KeyHeroin = D2
KeyPills = D3
KeyRobDealer = D5

; ---- dealer blip (game blip number, 82 = radar_multiplayer)
BlipDealer = 82

; ---- chance (%) of the player lines SellBegin, SellAfter
SellBeginChance = 100
SellAfterChance = 60
; 1 = keep the Dealer lines below even when locations.txt has dealers in it
KeepIniDealers = 0

; ---- sound and screen
; player .wav volume, 0-1000 (same as GreetTauntRob's VoiceVolume; 1000 = the file as recorded)
VoiceVolume = 200
ShowBlips = 1
BlipRange = 150
ShowMessages = 1
FontFamily = 
; leave empty to use the .ttf found in scripts\Pusher, scripts\GreetTauntRob, scripts\Dialogue or scripts\StopRightThere
FontFile = 
; distance of the menu from the right and bottom screen edges (pixels at 1080p)
UiRight = 70
UiBottom = 150
DealerModel = M_Y_DEALER

; ---- animations: animation set, animation name
; (the hand-over can also be  amb@beg_standing, give_obj  /  amb@beg_standing, take_obj)
AnimPlayerSell = amb@beg_standing, give_obj
AnimNpcBuy = amb@beg_standing, take_obj
AnimPlayerBuy = amb@beg_standing, take_obj
AnimDealerSell = amb@beg_standing, give_obj
; whoever pays takes out his wallet first
AnimWallet = amb@atm, m_getoutwallet_pocket
AnimPutAway = amb@atm, m_putwalletaway_chest
AnimPutAwayPocket = amb@atm, m_putwalletaway_pocket
; selling: you take the drugs out of your jacket with this
AnimDrugsOut = amb@atm, m_getoutwallet_chest
; the hand-over: distance between the two (m), wallet time (ms), then from the start of
; buy_drugs / sell_drugs: when the drugs change hands, and when both stop (ms)
DealDistance = 1.05
WalletMs = 2200
HandoverPhase = 0.45
TradeHandoverMs = 1200
TradeEndMs = 3500
AnimNpcSearch = amb@nightclub_ext, bouncer_a_frisk
AnimNpcPunch = melee_unarmed_base, partial_punch_r
AnimCopFrisk = cop, cop_search
AnimPlayerFrisked = amb@nightclub_ext, clubber_frisked
AnimTrunkSearch = cop, copm_searchboot
; dealers stand like this while waiting, and talk with this when you walk up
AnimDealerIdle = amb@default, bouncer_default
AnimDealerTalk = amb@nightclub_ext, street_chat_a
; the dealer dropping his money when you rob him
AnimDealerDropCash = amb@beg_standing, give_obj

; ---- the props handed over (OpenIV names, no .wdr)
ModelCokeBag = cscokebag
ModelCokePack = cj_coke_pack
ModelHeroin = csheroinbag
ModelPills = cspillbottle
ModelMoney = csmoneynote
; where each prop sits in the right hand: x, y, z offset, x, y, z rotation (degrees)
PropCoke = 0.1, 0.02, -0.02, 0, 0, 90
PropHeroin = 0.1, 0.02, -0.02, 270, 0, 195
PropPills = 0.09, 0.03, -0.01, 0, 0, 0
PropCokePack = 0.12, 0.03, -0.04, 75, 345, 195
PropMoney = 0.09, 0.02, -0.02, 0, 75, 105

; ---- pickup icons (Icons\coke_pack_pickup.png, heroin_pickup.png, pills_pickup.png) above the minimap
; when you get drugs without buying them. X / Y = the middle spot (where a single icon goes), 0-1 of the screen.
; Size = icon height, Arc = distance from the minimap's centre to the icons (both 0-1 of screen height).
; Spread = degrees between icons along the minimap's curve. Fade in / hold / fade out in ms.
PickupIconX = 0.107
PickupIconY = 0.72
PickupIconSize = 0.04
PickupIconArc = 0.12
PickupIconSpread = 30
PickupIconFadeInMs = 1000
PickupIconHoldMs = 3000
PickupIconFadeOutMs = 1000

; ---- NPC lines: speech contexts the game plays in each NPC's own voice (his model's voice bank).
; One is picked at random; if his voice has no such line the next one is tried. Nobody talks over anybody.
SpeechDealerGreet = GENERIC_HI, CHAT_RESP
SpeechDealerDone = THANKS, GENERIC_BYE, GENERIC_YES
SpeechDealerNoSale = GENERIC_DEJECTED, GENERIC_BYE
SpeechDealerRobbed = SHOCKED, GENERIC_NO, GENERIC_DEJECTED
SpeechDealerFight = FIGHT, GENERIC_FUCK_OFF, INTIMIDATE_RESP
SpeechBuyerAgree = GENERIC_YES, CHAT_RESP, GENERIC_HI
SpeechBuyerDone = THANKS, GENERIC_BYE
SpeechBuyerNoSale = GENERIC_NO, GENERIC_DEJECTED, GENERIC_BYE
SpeechPunch = FIGHT, GENERIC_FUCK_OFF, INTIMIDATE_RESP
SpeechRob = INTIMIDATE_RESP, GENERIC_FUCK_OFF, JEERING
SpeechHookerSting = SOLICIT_TURNED_DOWN_01, SOLICIT_TURNED_DOWN_02, SOLICIT_TURNED_DOWN_03
; cops say GET_OUT_OF_CAR_SHOUT, ASK_TO_OPEN_TRUNK, FOUND_NOTHING, ARREST_PED / ARREST_PLAYER /
; PLACE_HANDS_ON_HEAD with their own voice; if theirs has none, one of these voice banks is used
CopVoices = M_M_FATCOP_01_BLACK, M_M_FATCOP_01_WHITE, M_Y_COP_BLACK, M_Y_COP_BLACK_02, M_Y_COP_HISPANIC, M_Y_COP_TRAFFIC_BLACK, M_Y_COP_TRAFFIC_HISPANIC, M_Y_COP_TRAFFIC_WHITE, M_Y_COP_WHITE, M_Y_COP_WHITE_02
; police search animations
AnimPlayerOpenTrunk = amb@car_stash, open_boot
AnimCloseBoot = car_boot, close_boot
AnimCheckUnder = cop_search_idles, idle_check_under_vehicle
AnimPartnerLook = amb@bouncer_idles_b, lookaround_a
AnimCopCarChat = amb@bridgecops, car_chat_outside
AnimArmsUp = cop, armsup_loop
AnimArmsToSearched = cop, armsup_2_searched_pose
AnimSearchedPose = cop, searched_pose
AnimCrimCuffed = cop, crim_cuffed
AnimGetInCuffed = veh@std, get_in_ds
AnimCopCloseDoor = veh@std, d_close_out_ds
AnimCopOpenDoor = veh@std, d_open_out_ds
AnimCopCuff = cop, cop_cuff
; taken from your cash when you comply and get booked
ArrestFine = 250

